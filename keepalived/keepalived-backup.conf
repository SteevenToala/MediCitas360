# ==========================================
# KEEPALIVED CONFIGURATION - BACKUP SERVER
# Project: MediCitas 360 High Availability Portal
# File: /etc/keepalived/keepalived.conf
# ==========================================

global_defs {
    router_id LVS_DEVEL
}

# Script to monitor if Nginx/Apache is running
vrrp_script chk_web_server {
    script "pidof nginx || pidof apache2"
    interval 2
    weight 2
}

vrrp_instance VI_1 {
    state BACKUP
    interface eth0               # Network interface, adjust if needed (e.g. ens33)
    virtual_router_id 51
    priority 100                 # Lower priority than master (100 vs 101)
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass medicitas123   # Shared secret between master and backup
    }

    virtual_ipaddress {
        192.168.100.50/24        # Same Virtual IP address
    }

    track_script {
        chk_web_server
    }
}

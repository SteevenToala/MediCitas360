# ==========================================
# KEEPALIVED CONFIGURATION - MASTER SERVER
# Project: MediCitas 360 High Availability Portal
# File: /etc/keepalived/keepalived.conf
# ==========================================

global_defs {
    router_id LVS_DEVEL
}

# Script to monitor if Nginx/Apache is running
vrrp_script chk_web_server {
    script "pidof nginx || pidof apache2"
    interval 2
    weight 2
}

vrrp_instance VI_1 {
    state MASTER
    interface eth0               # Network interface, adjust if needed (e.g. ens33)
    virtual_router_id 51
    priority 101                 # Higher priority than backup (101 vs 100)
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass medicitas123   # Shared secret between master and backup
    }

    virtual_ipaddress {
        192.168.100.50/24        # Virtual IP address to access the portal
    }

    track_script {
        chk_web_server
    }
}

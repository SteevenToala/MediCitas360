events {
    worker_connections 1024;
}

http {
    # Define the group of servers to balance requests between
    upstream medicitas_api {
        # Using round-robin balancing with failover detection
        server 127.0.0.1:5001 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:5002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name localhost;

        # Direct all root/endpoint requests to the API cluster
        location / {
            proxy_pass http://medicitas_api;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable failover mechanism to immediately try next server if one fails
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}

# ==========================================
# SQUID PROXY CONFIGURATION
# Project: MediCitas 360
# ==========================================

# Port Squid listens on
http_port 3128

# Access Control Lists (ACLs)
# 1. Allowed domains
acl sitios_permitidos dstdomain .uta.edu.ec uta.edu.ec

# 2. Local network source
acl red_local src all

# Rules application
# Allow traffic from local network only to permitted sites
http_access allow red_local sitios_permitidos

# Deny everything else
http_access deny all

# Log file locations (optional configurations)
# access_log daemon:/var/log/squid/access.log squid
# cache_log /var/log/squid/cache.log
